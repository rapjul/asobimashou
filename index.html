<!doctype html>
<html lang="en">

<head>
  <title>Asobimashou!</title>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=1, user-scalable=0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F8F9FA" />
  <meta property="title" content="Asobimashou!" />
  <meta http-equiv="content-language" content="en" />
  <meta property="description" content="A minimal website to practice reading Japanese katakana and hiragana!" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Asobimashou!" />
  <meta property="og:site_name" content="あそびましょう！" />
  <meta property="og:description" content="A minimal website to practice reading Japanese katakana and hiragana!" />
  <meta property="og:image" content="https://rapjul.github.io/asobimashou/assets/images/thumbnail.png" />
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://rapjul.github.io/asobimashou/" />
  <meta property="twitter:title" content="Asobimashou!" />
  <meta property="twitter:description"
    content="A minimal website to practice reading Japanese katakana and hiragana!" />
  <meta property="twitter:image" content="https://rapjul.github.io/asobimashou/assets/images/thumbnail.png" />
  <link href="favicon.svg" rel="icon" type="image/svg+xml" />
  <link href="manifest.json" rel="manifest" />
  <link href="apple-touch-icon.png" rel="apple-touch-icon" />
  <link href="assets/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
  <link href="assets/css/icons.css" rel="stylesheet" />
  <link href="assets/css/fonts.css" rel="stylesheet" />
  <script src="assets/js/wanakana.min.js"></script>
</head>

<body class="preload">
  <!-- Offline Status Badge -->
  <div id="offline-badge" class="d-none" aria-live="polite" aria-label="Offline Mode">
    <i class="bi-wifi-off"></i> Offline
  </div>

  <!-- Main Menu -->
  <section id="menu" class="bg-light">
    <div class="centering-wrapper container">
      <div class="mb-3 display-5 game-font-change">
        <ruby>あそびましょう！<rt>Asobimashou!</rt></ruby>
        <br />
        (Let's Play!)
      </div>
      <div class="mb-3 btn-group-vertical" role="group">
        <button id="start" class="btn py-2" disabled>
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span>Loading Game...</span>
        </button>
        <button id="option" class="btn py-2 border-top-0 border-bottom-0">
          <i class="bi-gear-fill"></i>
          Options
        </button>
        <div id="option-wrapper" class="border">
          <div class="row justify-content-center mb-3">
            <div class="col-auto btn-group-vertical" role="group">
              <select id="game-font" class="form-select rounded-0 rounded-top" title="Select Game Font"
                aria-label="Select Game Font">
                <option value="system-ui">System Sans-Serif</option>
                <option value="serif">System Serif</option>
                <option value="Klee One">Klee One</option>
                <option value="Noto Sans JP" selected>Noto Sans JP</option>
                <option value="Noto Serif JP">Noto Serif JP</option>
                <option value="Yuji Syuku">Yuji Syuku</option>
              </select>
              <div class="btn-group" role="group">
                <button class="btn game-theme active" value="system">System</button>
                <button class="btn game-theme ms-0" value="light">Light</button>
                <button class="btn game-theme ms-0" value="dark">Dark</button>
              </div>
              <button id="game-kanji" class="btn rounded-0 rounded-bottom">Show Kanji</button>
            </div>
            <div class="col-auto btn-group-vertical" role="group">
              <button id="game-hiragana" class="btn game-type">ひらがな</button>
              <button id="game-mixed" class="btn game-type">Mixed</button>
              <button id="game-katakana" class="btn game-type">カタカナ</button>
            </div>
          </div>
          <div class="row justify-content-center mb-3">
            <div class="col-auto btn-group-vertical" role="group">
              <div class="btn-group">
                <button class="btn game-card active" value="Random">Random</button>
                <button class="btn game-card" value="JLPT">JLPT N5-N4</button>
              </div>
            </div>
          </div>
          <div class="row justify-content-center">
            <div class="col-auto btn-group-vertical" role="group">
              <button id="game-dakuten" class="btn active">
                <span>Dakuten</span>
              </button>
              <button id="game-tsu" class="btn active">
                <span>Doubled Consonants</span>
              </button>
              <button id="game-combo" class="btn active">
                <span>Combo Kana</span>
              </button>
              <button id="game-smallvowel" class="btn active">
                <span>Small Vowels</span>
              </button>
              <button id="game-vowellength" class="btn active">
                <span>Vowel Length</span>
              </button>
            </div>
          </div>
          <div id="option-help" class="text-muted mt-2 text-center small" aria-live="polite">
            Hover or focus an option to see details.
          </div>
        </div>
        <button id="review" class="btn py-2" disabled>
          <i class="bi-arrow-counterclockwise"></i>
          Review
        </button>
      </div>
      <div class="d-flex justify-content-center align-items-center gap-1 fs-3">
        <a class="text-reset text-decoration-none" href="https://github.com/rapjul/asobimashou/tree/update"
          target="_blank" rel="noopener noreferrer" aria-label="GitHub Repository">
          <i class="bi-github"></i>
        </a>
      </div>
    </div>
  </section>

  <!-- Play Area -->
  <main id="game" class="container-fluid d-none">
    <div class="game-spacer top-spacer"></div>
    <div class="game-content-wrapper d-flex flex-column justify-content-center align-items-center">
      <div id="stats-row" class="row justify-content-center align-items-center gap-3">
        <h2 id="score" class="stat-item col col-lg-3 m-0">
          <i class="bi-check-circle"></i>
          0/0
        </h2>
        <button id="stop" class="col-auto btn">
          <i class="bi-stop-fill"></i>
          End
        </button>
        <h2 id="time" class="stat-item col col-lg-3 m-0">
          0
          <i class="bi-clock"></i>
        </h2>
      </div>
      <div class="container">
        <div id="question-wrapper" class="row justify-content-center col-auto py-5">
          <ruby id="question" class="display-4 game-font-change">
            またひとり
            <rt>また一人</rt>
          </ruby>
          <input id="question-id" class="d-none" type="number" aria-label="Question ID" />
        </div>
      </div>
      <div id="answer-wrapper" class="row justify-content-center mb-4 col-10 col-md-7 col-lg-5">
        <input id="answer" type="text" name="answer" class="form-control-lg game-font-change" placeholder="Answer"
          autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-label="Answer" />
      </div>
      <div id="hints-wrapper" class="row justify-content-center align-items-center text-center gap-3">
        <div class="col-auto" aria-label="Press space to skip this question.">Press <kbd>Space</kbd> to skip.</div>
        <button id="skip" class="col-auto btn btn-sm" aria-label="Skip this question.">
          <i class="bi-skip-forward-fill"></i>
          Skip
        </button>
        <div class="col-auto hint-keyboard" aria-label="Press tab to end the game.">Press <kbd>Tab</kbd> to end.</div>
      </div>
    </div>
    <div class="game-spacer bottom-spacer"></div>
  </main>

  <!-- End Banner -->
  <section id="result" class="d-none">
    <div class="centering-wrapper container">
      <h1><b>Final Result</b></h1>
      <div class="row mb-3 justify-content-center">
        <div class="col-auto">
          <p>Answered</p>
          <i id="stats-answered">0</i>
        </div>
        <div class="col-auto">
          <p>Skipped</p>
          <i id="stats-skipped">0</i>
        </div>
        <div class="col-auto">
          <p>Time</p>
          <i id="stats-timer">0</i>
        </div>
        <div class="col-auto">
          <p>Average</p>
          <i id="stats-average">0</i>
        </div>
      </div>
      <div id="review-wrapper" class="table-responsive">
        <table class="table table-hover m-0">
          <tbody id="review-table" class="game-font-change"></tbody>
        </table>
      </div>
      <div class="d-flex justify-content-center">
        <button id="copy" class="btn me-3">
          <i class="bi-table"></i>
          Copy Table
        </button>
        <button id="share" class="btn me-3">
          <i class="bi-share-fill"></i>
          Share
        </button>
        <button id="restart" class="btn">
          <i class="bi-house-fill"></i>
          Home
        </button>
      </div>
    </div>
  </section>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="position-fixed top-0 start-50 translate-middle-x p-3"></div>

  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
  <script src="assets/js/cards.js" async></script>
  <script src="assets/js/sw-register.js"></script>
</body>

</html>
