<!doctype html>
<html lang="en">

<head>
  <title>Asobimashou! — Offline</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F8F9FA" />
  <link href="favicon.svg" rel="icon" type="image/svg+xml" />
  <link href="apple-touch-icon.png" rel="apple-touch-icon" />
  <link rel="manifest" href="manifest.json" />
  <link href="assets/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/css/icons.css" rel="stylesheet" />
  <link href="assets/css/fonts.css" rel="stylesheet" />
  <style>
    /* -------------------------------------------------------
       * Offline page — mirrors the main app's centered layout.
       * -------------------------------------------------------
       */
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f8f9fa;
      color: #212529;
      text-align: center;
      font-family: system-ui, sans-serif;
    }

    /* Large icon with a soft pulse to indicate waiting state */
    .offline-icon {
      font-size: 5rem;
      color: #6c757d;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(0.95);
      }
    }

    /* Kana decoration */
    .kana {
      font-size: 1.25rem;
      color: #6c757d;
      letter-spacing: 0.1em;
    }
  </style>
</head>

<body>
  <i class="bi-wifi-off offline-icon" aria-hidden="true"></i>

  <h1 class="mt-4 mb-1">You're Offline</h1>
  <p class="kana">オフライン中</p>

  <p class="mt-3 mb-4 text-muted col-10 col-md-6">
    It looks like you don't have an internet connection right now. Connect to the network and try again — once the
    page has loaded once it'll work completely offline.
  </p>

  <button id="retry-btn" class="btn btn-outline-dark px-4 py-2" type="button" onclick="window.location.reload()"
    aria-label="Retry loading the page">
    <i class="bi-arrow-clockwise" aria-hidden="true"></i>
    Try again
  </button>
</body>

</html>
