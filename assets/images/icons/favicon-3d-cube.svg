<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradients for the cube faces -->
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <linearGradient id="leftGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
  </defs>
  <style>
    .face {
      stroke: #312e81;
      stroke-width: 1.5;
      stroke-linejoin: round;
    }

    .cube-text {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Klee One", "Noto Serif JP", sans-serif;
      font-weight: 700;
      text-anchor: middle;
    }
  </style>
  <g id="cube">
    <!-- Top Face -->
    <polygon class="face" fill="url(#topGrad)" points="50,14 82,30 50,46 18,30" />
    <!-- Left Face -->
    <polygon class="face" fill="url(#leftGrad)" points="18,30 50,46 50,82 18,66" />
    <!-- Right Face -->
    <polygon class="face" fill="url(#rightGrad)" points="50,46 82,30 82,66 50,82" />
  </g>

  <g id="cube-text">
    <!-- Text on Top Face: ★ -->
    <text class="cube-text" fill="#4f46e5" font-size="20px" transform="matrix(0.866, 0.5, -0.866, 0.5, 50, 30)" dy="0.37em">★</text>

    <!-- Text on Left Face: あ -->
    <text class="cube-text" fill="#ffffff" font-size="22px" transform="matrix(0.866, 0.5, 0, 1, 34, 57)" dy="0.37em">あ</text>

    <!-- Text on Right Face: ア -->
    <text class="cube-text" fill="#a7f3d0" font-size="22px" transform="matrix(0.866, -0.5, 0, 1, 66, 57)" dy="0.37em">ア</text>
  </g>
</svg>